
# Name displayed in the GitHub Actions tab
name: Python CI

# Run the workflow on pushes and pull requests targeting main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Jobs that GitHub Actions will execute
jobs:
  test:
    # Use a fresh Ubuntu virtual machine
    runs-on: ubuntu-latest

    steps:
      # Download the repository code
      - name: Check out code
        uses: actions/checkout@v4

      # Install the required Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install the dependencies listed in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute all pytest test cases
      - name: Run tests
        run: pytest
